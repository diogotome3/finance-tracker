spring:
  application:
    name: finance-tracker

  # Local development: load the repo-root .env as a properties file.
  # "optional:" = don't fail if missing (e.g. in Docker or CI).
  # Two paths so it works whether you start the app from backend/ or from the repo root.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Never put stack traces or exception messages in error responses.
  # (Spring Boot 4 moved these from server.error.* to spring.web.error.*)
  web:
    error:
      include-stacktrace: never
      include-message: never

  # Amounts as 1000.00, never 1E+3. Dates/Instants are ISO-8601 strings by default in Jackson 3.
  jackson:
    write:
      write-bigdecimal-as-plain: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  default-user-id: 1
  currency: EUR
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API docs. Set explicitly (instead of relying on springdoc's defaults) so that turning them off in a
# production profile is a visible choice. This also silences springdoc's "enabled by default" startup warnings.
# If a path changes, update the public URLs in SecurityConfig too.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
