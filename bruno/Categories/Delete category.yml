info:
  name: Delete category
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/categories/{{categoryId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
