info:
  name: Create duplicate
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/categories"
  body:
    type: json
    data: |-
      {"name": "salary",
      "type": "INCOME"}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
